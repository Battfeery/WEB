<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattFEEry - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Kaliwa: Login Form -->
        <div class="form-container">
            <form id="loginForm">
                                <!-- 1. Ito ang image sa itaas -->
                <img src="logo.jpg" alt="BattFEEry Icon" class="top-logo">
                <h1>Welcome Back</h1>
                <p class="subtitle">Log in to your BattFEEry account</p>
                
                <input type="text" id="loginId" placeholder="MCU School Email or ID No." required />
                <input type="password" id="loginPassword" placeholder="Password" required />
                
                <a href="#" class="forgot-password">Forgot your password?</a>
                
                <button type="submit" class="primary-btn">Sign In</button>
            </form>
        </div>

        <!-- Kanan: Branding at Link papuntang Sign Up -->
        <div class="overlay-container">
            <div class="overlay-panel">
                <h1 class="brand-name">BATTFEERY</h1>
                <p class="tagline">CHARGE • GO • DO MORE</p>
                <p class="description">Need a power bank but don't have an account yet?</p>
                <!-- Link papuntang signup.html -->
                <a href="signup.html" class="ghost">Create Account</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
