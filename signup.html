<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattFEEry - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Kaliwa: Sign Up Form -->
        <div class="form-container">
            <form id="signupForm">
                <img src="logo.jpg" alt="BattFEEry Icon" class="top-logo">
                <h1>Create Account</h1>
                <p class="subtitle">Register to rent a BattFEEry power bank</p>
                
                <input type="text" name="fullName" placeholder="Full Name" required />
                <input type="tel" name="contactNo" placeholder="Contact No. (e.g. 09XX XXX XXXX)" required />
                <input type="email" name="schoolEmail" placeholder="MCU School Email" required />
                <input type="text" name="idNo" placeholder="Student / Employee No." required />
                <input type="password" name="password" placeholder="Create Password" required />
                
                <div class="radio-group">
                    <span class="label-text">Classification:</span>
                    <label><input type="radio" name="role" value="student" required> Student</label>
                    <label><input type="radio" name="role" value="employee" required> Employee</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="#" id="termsLink">Terms and Conditions</a>.
                    </label>
                </div>
                
                <button type="submit" class="primary-btn">Register Account</button>
            </form>
        </div>

        <!-- Kanan: Branding at Link papuntang Login -->
        <div class="overlay-container">

            <div class="overlay-panel">
                <h1 class="brand-name">BATTFEERY</h1>
                <p class="tagline">CHARGE • GO • DO MORE</p>
                <p class="description">Already have an account with us?</p>
                <!-- Link papuntang login.html -->
                <a href="login.html" class="ghost">Sign In</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
